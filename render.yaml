services:
  - type: web
    name: hsk-quiz
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npx tsx prisma/seed.ts && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/prod.db
    disk:
      name: hsk-quiz-data
      mountPath: /var/data
      sizeGB: 1
