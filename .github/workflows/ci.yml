name: CI

# Runs the same checks this repo has run by hand before every commit all
# along (docs/35-ci-cd-plan.md) — type-check + lint, no database involved.
# Deliberately doesn't run `next build` here: that would need a real
# DATABASE_URL and would just be a second copy of what Vercel's own preview
# deploy already does for every PR.
#
# `npm audit` added per docs/45-audit-infra-security.md §4 — there was no
# dependency-vulnerability scanning at all before this, so an update pulling
# in a new high/critical CVE (like the postcss/sharp ones a routine `next`
# bump surfaced once this was actually checked) would ship silently.
# --audit-level=high: low/moderate advisories are common noise in a
# personal-scale app's transitive tree and would make this flaky; high+ is
# the bar worth failing a PR over.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`, which only reads schema.prisma —
      # no DATABASE_URL/DB connection needed for that.
      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx eslint .

      # scripts/check-audit.mjs, not a bare `npm audit` (added 2026-08-18): a
      # real GHSA-ggr8-5vv4-36mx advisory hit deepmerge-ts (a transitive dep
      # of @prisma/config), with no fixed prisma release available yet
      # (7.9.1 is still latest stable; npm's only offered "fix" is a forced
      # downgrade to prisma@6.12.0, a real breaking change). It's reachable
      # in npm's dependency graph only via @better-auth/prisma-adapter's
      # *optional peerDependency* on the `prisma` CLI package — confirmed by
      # reading that package's compiled output, it never actually imports
      # `prisma`/@prisma/config, so this can't execute in the deployed app.
      # `--omit=dev` doesn't filter it out (npm still counts it reachable via
      # that peer-dependency slot), hence the small allowlist script instead
      # — it still fails on any *other* high/critical advisory, new or
      # existing, same as before. See the script's own comments for the
      # allowlist entry's reasoning and when to remove it.
      - run: node scripts/check-audit.mjs
